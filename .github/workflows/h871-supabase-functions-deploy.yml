name: H871 deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Which H871 AI function(s) should be deployed
        required: true
        type: choice
        options:
          - both
          - enqueue-analysis
          - process-analysis-queue

permissions:
  contents: read

concurrency:
  group: h871-supabase-edge-function-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # This workflow is intentionally manual and restricted to the feature branch.
    # It does not run on push, pull_request, or a schedule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required deployment secret
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy selected Edge Function(s)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hwynbpvorlusicgafuxs
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
        run: |
          set -euo pipefail

          case "${DEPLOY_TARGET}" in
            both)
              supabase functions deploy enqueue-analysis --project-ref "${PROJECT_REF}"
              supabase functions deploy process-analysis-queue --project-ref "${PROJECT_REF}"
              ;;
            enqueue-analysis|process-analysis-queue)
              supabase functions deploy "${DEPLOY_TARGET}" --project-ref "${PROJECT_REF}"
              ;;
            *)
              echo "Unsupported deployment target."
              exit 1
              ;;
          esac
