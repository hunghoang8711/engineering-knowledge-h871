name: H871 AI analysis validation

on:
  push:
    branches:
      - feature/cloud-ai-job-queue-20261030
      - feat/gemini-background-interactions
    paths:
      - "supabase/functions/process-analysis-queue/**"
      - "supabase/functions/analyze-document/**"
      - "frontend/navigation.js"
      - "supabase/migrations/0008_gemini_background_interactions.sql"
      - "supabase/migrations/0009_gemini_poll_retry_accounting.sql"
      - "supabase/migrations/0007_async_analysis_jobs.sql"
      - ".github/workflows/h871-ai-analysis-validation.yml"
      - ".github/workflows/h871-ai-analysis-queue.yml"
  pull_request:
    paths:
      - "supabase/functions/process-analysis-queue/**"
      - "supabase/functions/analyze-document/**"
      - "frontend/navigation.js"
      - "supabase/migrations/0008_gemini_background_interactions.sql"
      - "supabase/migrations/0009_gemini_poll_retry_accounting.sql"
      - "supabase/migrations/0007_async_analysis_jobs.sql"
      - ".github/workflows/h871-ai-analysis-validation.yml"
      - ".github/workflows/h871-ai-analysis-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-analysis-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check worker and pure result module
        run: deno check supabase/functions/analyze-document/index.ts supabase/functions/process-analysis-queue/index.ts supabase/functions/process-analysis-queue/analysis-result.ts supabase/functions/process-analysis-queue/analysis-result_test.ts supabase/functions/process-analysis-queue/storage-path.ts supabase/functions/process-analysis-queue/storage-path_test.ts

      - name: Check frontend JavaScript syntax
        run: node --check frontend/navigation.js

      - name: Run unit tests
        run: deno test --allow-net supabase/functions/process-analysis-queue/analysis-result_test.ts supabase/functions/process-analysis-queue/storage-path_test.ts
