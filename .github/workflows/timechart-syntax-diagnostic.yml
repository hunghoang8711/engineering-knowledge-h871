name: Temporary Time Chart Syntax Diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/timechart-syntax-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check inline scripts
        id: check
        continue-on-error: true
        run: |
          set +e
          node <<'NODE' 2>&1 | tee /tmp/timechart-syntax-result.txt
          const fs = require('fs');
          const html = fs.readFileSync('frontend/cycle-time-univer.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)].map(x => x[1]).filter(x => x.trim());
          console.log('inline scripts:', scripts.length);
          scripts.forEach((source, i) => {
            const file = '/tmp/timechart-inline-' + (i + 1) + '.js';
            fs.writeFileSync(file, source);
            const cp = require('child_process').spawnSync(process.execPath, ['--check', file], {encoding:'utf8'});
            console.log('SCRIPT', i + 1, 'length', source.length, 'exit', cp.status);
            if (cp.stdout) console.log(cp.stdout);
            if (cp.stderr) console.log(cp.stderr);
            if (cp.status !== 0) process.exitCode = 1;
          });
          NODE
      - name: Publish diagnostic result to repository
        if: always()
        run: |
          mkdir -p diagnostics
          cp /tmp/timechart-syntax-result.txt diagnostics/timechart-syntax-result.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/timechart-syntax-result.txt
          git commit -m "chore: record Time Chart syntax diagnostic" || true
          git push || true
      - name: Fail if JavaScript syntax is invalid
        if: steps.check.outcome == 'failure'
        run: exit 1
